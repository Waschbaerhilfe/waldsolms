<style>
:root{--band:#1f3a28;--ink:#eef3e4;--muted:#b9c9ae;--amber:#dca124;--field:#16291c;--err:#f0a08a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--band);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
img{width:132px;height:132px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 0 3px rgba(220,161,36,.7)}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;margin:0}
h1 span{color:var(--amber);display:block}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.5}
label.f{display:grid;gap:6px;text-align:left;font-size:14px;color:var(--muted)}
input[type=password]{font:inherit;font-size:17px;padding:12px 14px;border-radius:4px;border:1px solid rgba(238,243,228,.25);background:var(--field);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);justify-content:flex-start}
.rem input{accent-color:var(--amber);width:18px;height:18px}
button{font:inherit;font-weight:700;font-size:16px;padding:12px;border:0;border-radius:4px;background:var(--amber);color:#1b281d;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:15px;min-height:1.4em}
.hint{font-size:14px}
.hint a{color:var(--ink)}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <img src="img/logo.webp" alt="Logo Waschbär-Management Waldsolms" width="132" height="132">
  <h1>Waschbär&shy;management <span>Waldsolms</span></h1>
  <p>Dieser Bereich ist nur für Mitglieder unserer Gruppe.</p>
  <label class="f" for="pw">Passwort
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
  </label>
  <label class="rem" for="keep"><input type="checkbox" id="keep" checked> Auf diesem Gerät angemeldet bleiben</label>
  <button type="submit" id="go">Öffnen</button>
  <div class="err" id="err" role="alert"></div>
  <p class="hint">Kein Passwort? Fragen Sie in unserer <a href="https://www.facebook.com/groups/2588753514874169/" target="_blank" rel="noopener">Facebook-Gruppe</a> nach.</p>
</form>

const KEY="wbw-key-v2";
const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.normalize("NFC")),"PBKDF2",false,["deriveBits"]);
 return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:d64(P.s),iterations:P.n,hash:"SHA-256"},base,256))}
async function open(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d64(P.i)},k,d64(P.c)));
 document.open();document.write(html);document.close()}
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
 if(saved){try{await open(d64(saved));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");
 b.disabled=true;b.textContent="Wird geöffnet …";er.textContent="";
 try{const raw=await derive(document.getElementById("pw").value);
  if(document.getElementById("keep").checked){try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(_){}}
  await open(raw)}
 catch(err){er.textContent="Das Passwort stimmt nicht. Bitte noch einmal versuchen.";b.disabled=false;b.textContent="Öffnen"}});
</script>
